<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Configurações cruciais para parecer um App Nativo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>FamiliaApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TELA 1: AGENDA -->
    <div id="view-agenda" class="view active">
        <div class="header">
            <h2>📅 <span id="mes-ano-agenda">Semana</span></h2>
            <button class="btn-novo" id="btn-novo-evento">+ Evento</button>
        </div>
        <div id="agenda-container"></div>
    </div>

    <!-- TELA 2: TO-DO LIST -->
    <div id="view-todo" class="view">
        <div class="header">
            <h2>✅ Tarefas</h2>
            <button class="btn-novo" id="btn-nova-tarefa">+ Nova</button>
        </div>
        <div class="list-container">
            <h3>Pendentes</h3>
            <ul id="todo-list-pendentes"></ul>
            <h3 class="mt-4">Concluídas</h3>
            <ul id="todo-list-concluidas" class="concluidas"></ul>
        </div>
    </div>

    <!-- TELA 3: COMPRAS -->
    <div id="view-compras" class="view">
        <div class="header">
            <h2>🛒 Compras</h2>
            <button class="btn-novo" id="btn-nova-compra">+ Novo</button>
        </div>
        <div class="list-container">
            <ul id="compras-list"></ul>
        </div>
    </div>

    <!-- TELA 4: MEMO -->
    <div id="view-memo" class="view">
        <div class="header">
            <h2>📝 Notas</h2>
            <button class="btn-novo" id="btn-novo-memo">+ Nota</button>
        </div>
        <div class="list-container">
            <ul id="memo-list"></ul>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-agenda">
            <span class="icon">📅</span><span>Agenda</span>
        </button>
        <button class="nav-btn" data-target="view-todo">
            <span class="icon">✅</span><span>Tarefas</span>
        </button>
        <button class="nav-btn" data-target="view-compras">
            <span class="icon">🛒</span><span>Compras</span>
        </button>
        <button class="nav-btn" data-target="view-memo">
            <span class="icon">📝</span><span>Notas</span>
        </button>
    </nav>
    
    <script type="module" src="app.js"></script>
</body>
</html>
