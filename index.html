<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>Organizador Google</title>
    
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top App Bar -->
    <nav class="white z-depth-1 top-nav">
        <div class="nav-wrapper">
            <a href="#" class="brand-logo center blue-text text-darken-2" id="app-title">Agenda</a>
        </div>
    </nav>

    <!-- VIEWS -->
    <div id="views-container">
        
        <!-- TELA 1: AGENDA -->
        <div id="view-agenda" class="view active">
            <div class="center-align" style="padding: 10px 0;">
                <h5 class="grey-text text-darken-2" id="mes-ano-agenda" style="margin: 0; font-weight: 500;">Semana</h5>
            </div>
            <div id="agenda-container"></div>
        </div>

        <!-- TELA 2: TO-DO -->
        <div id="view-todo" class="view">
            <ul class="collection with-header z-depth-1" style="margin: 10px; border: none; border-radius: 12px;">
                <li class="collection-header"><h5>Pendentes</h5></li>
                <div id="todo-list-pendentes"></div>
                <li class="collection-header" style="margin-top: 20px;"><h5>Concluídas</h5></li>
                <div id="todo-list-concluidas" class="concluidas"></div>
            </ul>
        </div>

        <!-- TELA 3: COMPRAS -->
        <div id="view-compras" class="view">
            <ul class="collection z-depth-1" id="compras-list" style="margin: 10px; border: none; border-radius: 12px;"></ul>
        </div>

        <!-- TELA 4: MEMO -->
        <div id="view-memo" class="view">
            <div class="row" id="memo-list" style="margin: 10px;"></div>
        </div>

    </div>

    <!-- BOTÃO FLUTUANTE GLOBAL (Estilo Google) -->
    <div class="fixed-action-btn">
        <button id="main-fab" class="btn-floating btn-large blue darken-2 waves-effect waves-light shadow-3">
            <i class="large material-icons">add</i>
        </button>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <div class="bottom-nav z-depth-3">
        <a href="#!" class="nav-item active" data-target="view-agenda" data-title="Agenda">
            <i class="material-icons">event</i><span>Agenda</span>
        </a>
        <a href="#!" class="nav-item" data-target="view-todo" data-title="Tarefas">
            <i class="material-icons">check_circle</i><span>Tarefas</span>
        </a>
        <a href="#!" class="nav-item" data-target="view-compras" data-title="Compras">
            <i class="material-icons">shopping_cart</i><span>Compras</span>
        </a>
        <a href="#!" class="nav-item" data-target="view-memo" data-title="Notas">
            <i class="material-icons">sticky_note_2</i><span>Notas</span>
        </a>
    </div>

    <!-- MODAL DE ADIÇÃO (Substitui o prompt bloqueado) -->
    <div id="modal-add" class="modal bottom-sheet">
        <div class="modal-content">
            <h5 id="modal-title">Nova Tarefa</h5>
            <div class="input-field" id="modal-date-wrapper" style="display: none;">
                <input id="modal-date" type="date">
                <label for="modal-date" class="active">Data do Evento</label>
            </div>
            <div class="input-field">
                <input id="modal-input" type="text" autocomplete="off">
                <label for="modal-input">O que deseja adicionar?</label>
            </div>
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-close waves-effect waves-red btn-flat">Cancelar</a>
            <button id="btn-save" class="waves-effect waves-blue blue white-text btn-flat" style="border-radius: 20px; margin-right: 15px;">Salvar</button>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
